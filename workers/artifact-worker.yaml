worker:
  name: artifact-worker
  type: artifact

capabilities:
  - adr_generation
  - summarization
  - embedding_storage
  - report_generation
  - knowledge_snapshots

adr:
  enabled: true
  template: templates/adr.md
  output: /artifacts/ADRs

reports:
  enabled: true
  types:
    - architecture_comparison
    - release_analysis
    - layer1_reports
  output: /artifacts

embeddings:
  enabled: true
  model: nomic-embed-text
  storage: /workspace/embeddings

knowledge_snapshots:
  enabled: true
  interval: 86400
  output: /artifacts/Knowledge Graph

message_queue:
  type: redis
  host: localhost
  port: 6379

queue:
  artifacts: artifact:process
  adrs: artifact:adr
  reports: artifact:report

storage:
  workspace: /workspace
  artifacts: /artifacts
