worker:
  name: research-worker
  type: research

capabilities:
  - github_scanning
  - rfc_ingestion
  - paper_download
  - job_queueing

github:
  enabled: true
  scan_interval: 3600
  sources:
    - type: trending
      language: typescript
      limit: 10
    - type: starred
      limit: 50
    - type: curated
      repos:
        - microsoft/typescript
        - facebook/react
        - nodejs/node

arxiv:
  enabled: true
  categories:
    - cs.DC
    - cs.DS
    - cs.PL
  query: distributed systems consensus

rfc:
  enabled: true
  categories:
    - http
    - tcp
    - tls
    - oauth

papers:
  enabled: true
  sources:
    - https://arxiv.org
    - https://dl.acm.org

message_queue:
  type: redis
  host: localhost
  port: 6379

queue:
  jobs: research:jobs
  results: research:results

storage:
  workspace: /workspace
  artifacts: /artifacts/Research
