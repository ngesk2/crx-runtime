worker:
  name: gateway-worker
  type: gateway

capabilities:
  - api_server
  - orchestration
  - skill_execution
  - artifact_routing

api:
  host: 0.0.0.0
  port: 8080

endpoints:
  - /api/v1/ingest
  - /api/v1/query
  - /api/v1/artifacts
  - /api/v1/graph
  - /api/v1/status

message_queue:
  type: redis
  host: localhost
  port: 6379

workers:
  ollama:
    endpoint: http://ollama-worker:11434
  research:
    endpoint: http://research-worker:8081
  graph:
    endpoint: http://graph-worker:8082
  artifact:
    endpoint: http://artifact-worker:8083

storage:
  workspace: /workspace
  artifacts: /artifacts
  credentials: /credentials
