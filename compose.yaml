version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE LAYER
  # ============================================

  # PostgreSQL - Canonical State Store
  postgres:
    image: postgres:15-alpine
    container_name: ping-postgres
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
    volumes:
      - ping_postgres:/var/lib/postgresql/data
      - ./brainos/orchestration/constitutional/canonical_state/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - ping_internal
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector Projection
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ping-qdrant
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ping_qdrant:/qdrant/storage
    networks:
      - ping_internal
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vault - Secret Management
  vault:
    image: hashicorp/vault:latest
    container_name: ping-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - ping_vault:/vault/data
    networks:
      - ping_internal
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama - AI Model Runtime
  ollama:
    image: ollama/ollama:latest
    container_name: ping-ollama
    restart: unless-stopped
    volumes:
      - ping_ollama:/root/.ollama
    networks:
      - ping_internal
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============================================
  # PLATFORM LAYER
  # ============================================

  # Mission Control - Orchestration API
  mission-control:
    build:
      context: .
      dockerfile: brainos/orchestration/infrastructure/docker/Dockerfile.mission-control
    container_name: ping-mission-control
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: constitutional_memory
      OLLAMA_BASE_URL: http://ollama:11434
      INFERENCE_BASE_URL: http://ollama:11434
      YAHOO_EMAIL: ${YAHOO_EMAIL}
      YAHOO_APP_PASSWORD: ${YAHOO_APP_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./vault:/app/vault:ro
    networks:
      - ping_internal
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    profiles:
      - dev
      - prod

  # Repository Runtime - Read-only cognition layer
  repo-runtime:
    image: alpine:latest
    container_name: ping-repo-runtime
    restart: unless-stopped
    read_only: true
    volumes:
      - ./:/repo/ping:ro
      - ./vault:/repo/content:ro
      - ./DriveMirror:/repo/drive:ro
      - ./Artifacts:/repo/artifacts:ro
      - ./Graphs:/repo/graphs
      - ./Indexes:/repo/indexes
    command: ["sleep", "infinity"]
    networks:
      - ping_internal
    profiles:
      - dev
      - prod

  # Gateway - API Gateway with Model Routing
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: ping-gateway
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      QDRANT_URL: http://qdrant:6333
      INFERENCE_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: nomic-embed-text
      CHAT_MODEL: qwen2.5-coder:14b
    ports:
      - "8080:8080"
    networks:
      - ping_internal
    depends_on:
      - ollama
      - postgres
    profiles:
      - dev
      - prod

  # ============================================
  # WORKER LAYER
  # ============================================

  # Digestion Worker - RSS/Article Processing
  digestion-worker:
    build:
      context: ./brainos/rss
      dockerfile: Dockerfile
    container_name: ping-digestion-worker
    restart: unless-stopped
    env_file:
      - ./brainos/rss/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
    volumes:
      - ./brainos/rss/knowledge:/app/knowledge
      - ./brainos/rss/knowledge.db:/app/knowledge.db
    networks:
      - ping_internal
    depends_on:
      - ollama
      - postgres
    profiles:
      - dev

  # Newsletter Worker - Yahoo Mail Processing
  newsletter-worker:
    build:
      context: ./brainos/newsletter
      dockerfile: Dockerfile
    container_name: ping-newsletter-worker
    restart: unless-stopped
    env_file:
      - ./brainos/newsletter/.env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
    volumes:
      - ./brainos/newsletter/knowledge:/app/knowledge
      - ./brainos/newsletter/newsletters.db:/app/newsletters.db
      - ./brainos/newsletter/digests:/app/digests
    networks:
      - ping_internal
    depends_on:
      - ollama
      - postgres
    profiles:
      - dev

  # Projection Worker - Vector Projection
  projection-worker:
    build:
      context: .
      dockerfile: Dockerfile.projection
    container_name: ping-projection-worker
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
    networks:
      - ping_internal
    depends_on:
      - qdrant
      - postgres
    profiles:
      - dev

  # Witness Worker - Witness Computation
  witness-worker:
    build:
      context: .
      dockerfile: Dockerfile.witness
    container_name: ping-witness-worker
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
    networks:
      - ping_internal
    depends_on:
      - postgres
    profiles:
      - dev

  # Replay Worker - Event Replay
  replay-worker:
    build:
      context: .
      dockerfile: Dockerfile.replay
    container_name: ping-replay-worker
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ping_runtime}
    networks:
      - ping_internal
    depends_on:
      - postgres
    profiles:
      - dev

  # Worker Runtime - Constitutional Pipeline Driver
  worker-runtime:
    build:
      context: .
      dockerfile: Dockerfile.worker-runtime
    container_name: ping-worker-runtime
    restart: unless-stopped
    env_file:
      - .env.base
    environment:
      GATEWAY_URL: http://gateway:8080
      POLL_INTERVAL: "5.0"
      MAX_RETRIES: "3"
      WORKER_NAME: worker_runtime
    networks:
      - ping_internal
    depends_on:
      gateway:
        condition: service_started
    profiles:
      - dev
      - prod

  # ============================================
  # UI LAYER
  # ============================================

  # Next.js UI - Frontend
  ui:
    build:
      context: ./CascadeProjects/infra/ui-next
      dockerfile: Dockerfile
    container_name: ping-ui
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GATEWAY_URL: http://gateway:8080
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    networks:
      - ping_internal
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    profiles:
      - dev
      - prod

networks:
  ping_internal:
    driver: bridge
    internal: false

volumes:
  ping_postgres:
    driver: local
  ping_qdrant:
    driver: local
  ping_ollama:
    driver: local
  ping_vault:
    driver: local
