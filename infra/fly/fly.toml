# fly.toml for PING Edge Services

app = "ping-edge"
primary_region = "iad"

[build]
  dockerfile = "../deploy/Dockerfile"

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "8000"
  OTEL_EXPORTER_OTLP_ENDPOINT = "http://otel-collector:4317"
  OTEL_SERVICE_NAME = "ping-edge"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  strategy = "rolling"

[metrics]
  port = 9464
  path = "/metrics"
