version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: crx-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crx_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-crx_kernel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crx-network

  redis:
    image: redis:7-alpine
    container_name: crx-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crx-network

  ollama:
    image: ollama/ollama:latest
    container_name: crx-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - crx-network

  prometheus:
    image: prom/prometheus:latest
    container_name: crx-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./volumes/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - crx-network

  grafana:
    image: grafana/grafana:latest
    container_name: crx-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./volumes/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - crx-network

  loki:
    image: grafana/loki:latest
    container_name: crx-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml
      - ./volumes/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crx-network

  tempo:
    image: grafana/tempo:latest
    container_name: crx-tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_PORT:-4317}:4317"
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo-config.yaml
      - ./volumes/tempo:/tmp/tempo
    command: -config.file=/etc/tempo-config.yaml
    networks:
      - crx-network

networks:
  crx-network:
    driver: bridge
