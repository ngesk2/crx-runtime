name: Constitutional CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run build
      run: npm run build
    
    - name: Run unit tests
      run: npm test

  replay-corpus:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Load golden corpus
      run: node test/replay_corpus_test.js
    
    - name: Verify all transcripts
      run: node test/verify_corpus.js
    
    - name: Generate certificates
      run: node test/generate_certificates.js
    
    - name: Compare with golden certificates
      run: node test/compare_certificates.js

  fuzz:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run constitutional fuzzer
      run: node test/fuzz_test.js --iterations 1000
    
    - name: Verify deterministic hashes
      run: node test/verify_determinism.js

  cross-platform-replay:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run cross-platform replay test
      run: node test/cross_platform_replay.js
    
    - name: Verify identical hashes
      run: node test/verify_cross_platform_hashes.js

  witness-verification:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Verify all witnesses
      run: node test/verify_witnesses.js
    
    - name: Verify witness authority
      run: node test/verify_witness_authority.js
    
    - name: Verify witness equivalence
      run: node test/verify_witness_equivalence.js

  constitutional-compliance:
    runs-on: ubuntu-latest
    needs: [build, replay-corpus, fuzz, cross-platform-replay, witness-verification]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run constitutional compliance check
      run: node test/constitutional_compliance.js
    
    - name: Generate compliance report
      run: node test/generate_compliance_report.js
    
    - name: Upload compliance report
      uses: actions/upload-artifact@v3
      with:
        name: compliance-report
        path: compliance_report.json

  merge-gate:
    runs-on: ubuntu-latest
    needs: [constitutional-compliance]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download compliance report
      uses: actions/download-artifact@v3
      with:
        name: compliance-report
    
    - name: Verify compliance
      run: node test/verify_merge_gate.js
    
    - name: Block merge if not compliant
      if: failure()
      run: |
        echo "Constitutional compliance check failed. Merge blocked."
        exit 1
