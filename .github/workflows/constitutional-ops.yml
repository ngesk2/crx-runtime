name: Constitutional Operations

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  constitutional-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate mission graph
        run: python scripts/constitutional_query.py show VerifyReplay
