name: Intent Graph Validation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate-intent-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Generate indexes and validate
        run: python scripts/intent_cli.py generate
