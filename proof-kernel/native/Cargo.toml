[package]
name = "ping-proof-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ping-proof-kernel = { path = ".." }
napi = { version = "=3.3.0", default-features = false, features = ["napi6", "dyn-symbols"] }
napi-derive = "=3.2.5"
serde_json = "=1.0.145"
