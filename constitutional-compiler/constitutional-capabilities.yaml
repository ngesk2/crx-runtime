    - runtime/replay/**
  consumers:
    - runtime/kernel

ConstitutionalEvidence:
  owner: runtime/kernel
  authority: ConstitutionalIRAuthority
  implementation:
    - runtime/constitution/**
  consumers:
    - runtime/kernel
    - constitutional-compiler
