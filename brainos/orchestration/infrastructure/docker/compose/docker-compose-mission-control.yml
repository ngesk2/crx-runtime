version: '3.8'

services:
  # Mission Control API
  mission-control:
    build:
      context: ../../../../../
      dockerfile: brainos/orchestration/infrastructure/docker/Dockerfile.mission-control
    container_name: ping-mission-control
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: crx_runtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: constitutional_memory
      OLLAMA_BASE_URL: http://ollama:11434
      INFERENCE_BASE_URL: http://ollama:11434
      YAHOO_EMAIL: ${YAHOO_EMAIL}
      YAHOO_APP_PASSWORD: ${YAHOO_APP_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ../../../../../vault:/app/vault
    networks:
      - brain_internal
    depends_on:
      - postgres
      - qdrant
      - ollama

  # PostgreSQL - Canonical State
  postgres:
    image: postgres:15-alpine
    container_name: brain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crx_runtime
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../../../brainos/orchestration/constitutional/canonical_state/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - brain_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - Vector Projection
  qdrant:
    image: qdrant/qdrant:latest
    container_name: brain-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - brain_internal
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama - AI Model Server
  ollama:
    image: ollama/ollama:latest
    container_name: brain-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - brain_internal
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # Open WebUI - Presentation Layer
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: brain-openwebui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-default-secret-key-change-in-production}
    depends_on:
      - ollama
      - mission-control
    networks:
      - brain_internal
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Repository Runtime — read-only cognition layer for all agents
  repo_runtime:
    image: alpine:latest
    container_name: brain-repo-runtime
    restart: unless-stopped
    read_only: true
    volumes:
      - ../../../../../:/repo/ping:ro
      - ../../../../../vault:/repo/content:ro
      - ../../../../../DriveMirror:/repo/drive:ro
      - ../../../../../Artifacts:/repo/artifacts:ro
      - ../../../../../Graphs:/repo/graphs
      - ../../../../../Indexes:/repo/indexes
    command: ["sleep", "infinity"]
    networks:
      - brain_internal

networks:
  brain_internal:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  openwebui_data:
