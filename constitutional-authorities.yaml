# Constitutional Authority Registry
# Phase S.16 — Constitutional Stabilization
# Every responsibility must have exactly one owner.
# This file is the constitution. Nothing else may claim ownership.

metadata:
  version: "1.0.0"
  phase: "S.16"
  established: "2026-06-27"
  rule: "Every responsibility has exactly one canonical implementation. All other code calls it."

# ─── Identity ───────────────────────────────────────────────────────────────

CanonicalIdentityService:
  owner: runtime/kernel
  specification: specs/identity-authority
  status: implemented
  implementation:
    - runtime/kernel/identity/canonical-identity-service.ts
  evidence: PROVEN
  duplicates:
    - file: runtime/security/capabilities.py
      classification: DuplicateAlgorithm
      evidence: "Defines separate Python Identity class. Does not call CanonicalIdentityService."
  action: "Route all Python identity generation through CanonicalIdentityService"  
  action_severity: HIGH

# ─── Hashing ────────────────────────────────────────────────────────────────

CanonicalHashAuthority:
  owner: runtime/kernel/hash
  specification: specs/hash-authority
  status: missing_package  # kernel/hash/ does not exist yet
  implementation:
    - runtime/kernel/witness/certificate_authority.ts  # Sole canonical SHA-256
    - runtime/kernel/witness/canonical_hash_authority.ts  # Bridge/wrapper
  evidence: PROVEN
  call_sites:
    - runtime/kernel/replay/merkle_tree.ts          # PROVEN — delegates to CertificateAuthority
    - runtime/kernel/commit-service/src/api/commit_controller.ts  # PROVEN — delegates
  duplicates:
    - file: runtime/kernel/witness/cryptographic-authorities.ts
      classification: DuplicateAlgorithm
      evidence: "Provides computeSHA256() that is NOT real SHA-256 (bit-shift string hash). Sits alongside canonical CertificateAuthority in same directory."
      action_severity: CRITICAL
  action: "Create kernel/hash/ package. Route every hash computation through it. Delete cryptographic-authorities.ts fake hashes."

