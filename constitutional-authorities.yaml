      classification: TestDuplicate
      evidence: "Inline witness root comparison. Does not call ReplayVerification."
    - file: tests/certification/replay-witness-regeneration.test.ts
      classification: TestDuplicate
      evidence: "Inline 3-field witness comparison. Does not call ReplayVerification."
    - file: tests/certification/replay-mutation.test.ts
      classification: TestDuplicate
      evidence: "Inline witness root string comparison."
    - file: tests/certification/replay-ordering-fuzz.test.ts
      classification: TestDuplicate
      evidence: "Inline witness root comparison across 100 replays."
    - file: tests/certification/replay-unicode.test.ts
      classification: TestDuplicate
      evidence: "Inline witness root comparison across unicode payloads."
    - file: workers/replay_worker.py
      classification: Stub
      evidence: "Placeholder — claims it will call DeterministicReplayEngine but does not yet."
  action: "Delete runtime duplicates. Make certification tests call canonical ReplayVerification."
  action_severity: CRITICAL

